<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>آفلاین | پلنر جامع</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f6f8f4; font-family: Vazirmatn, Tahoma, sans-serif; color: #0f172a; }
      .card { text-align: center; background: #fff; border: 1px solid #d1fae5; border-radius: 24px; padding: 40px 32px; max-width: 360px; box-shadow: 0 10px 30px rgba(21,128,61,.08); }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 16px 0 8px; color: #064e3b; }
      p { font-size: 14px; color: #64748b; line-height: 1.8; }
      button { margin-top: 16px; background: #15803d; color: #fff; border: 0; border-radius: 12px; padding: 10px 20px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>اتصال به اینترنت برقرار نیست</h1>
      <p>پلنر برای همگام‌سازی داده‌ها به سرور نیاز دارد. پس از اتصال دوباره تلاش کنید.</p>
      <button onclick="location.reload()">تلاش مجدد</button>
    </div>
  </body>
</html>
