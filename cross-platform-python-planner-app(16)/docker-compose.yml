# Production stack: PostgreSQL + planner server (+ optional Caddy for automatic HTTPS)
#   1) copy .env.production.example to .env.production and edit values
#   2) docker compose --env-file .env.production up -d --build
#   3) open https://YOUR_DOMAIN  (or http://SERVER_IP:3000 without Caddy)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-app_db}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  # Optional: automatic HTTPS reverse proxy. Set DOMAIN in .env.production and point DNS to the server.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["https"]
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to web:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
