<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>پلنر جامع</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f8f4;font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;color:#0f172a}
  .c{text-align:center}
  img{width:84px;height:84px;border-radius:22px;box-shadow:0 10px 30px rgba(4,120,87,.25)}
  h1{font-size:20px;margin:18px 0 6px;color:#064e3b}
  p{font-size:13px;color:#64748b;margin:0}
  .bar{width:200px;height:6px;border-radius:99px;background:#d1fae5;margin:18px auto 0;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;background:#047857;border-radius:99px;animation:slide 1.1s ease-in-out infinite alternate}
  @keyframes slide{from{transform:translateX(150%)}to{transform:translateX(-150%)}}
</style>
</head>
<body>
  <div class="c">
    <img src="icon.png" alt="">
    <h1>پلنر جامع</h1>
    <p id="t">در حال راه‌اندازی…</p>
    <div class="bar"><i></i></div>
  </div>
  <script>
    var t = new URLSearchParams(location.search).get("t");
    if (t) document.getElementById("t").textContent = t;
  </script>
</body>
</html>
